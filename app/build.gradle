plugins { id 'com.android.application' }
android {
 namespace 'app.xenet.client'
 compileSdk 35
 defaultConfig { resValue 'string', 'app_name', 'Xenet'; applicationId 'app.xenet.client'; minSdk 21; targetSdk 35; versionCode 101; versionName '1.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 splits { abi { enable true; reset(); include 'arm64-v8a','armeabi-v7a','x86','x86_64'; universalApk true } }
 packaging {
 jniLibs { useLegacyPackaging true }
 resources { excludes += ['META-INF/DEPENDENCIES'] }
 }
 signingConfigs { xenet { if (rootProject.file('signing/xenet-v1.jks').exists() && rootProject.file('signing/password.txt').exists()) { storeFile rootProject.file('signing/xenet-v1.jks'); storePassword rootProject.file('signing/password.txt').text.trim(); keyAlias 'xenet-v1'; keyPassword storePassword } } }
 buildTypes { debug { resValue 'string', 'app_name', 'Xenet'; applicationIdSuffix '.v1'; minifyEnabled false }; release { resValue 'string', 'app_name', 'Xenet'; applicationIdSuffix '.v1'; debuggable false; minifyEnabled false; if (rootProject.file('signing/xenet-v1.jks').exists() && rootProject.file('signing/password.txt').exists()) signingConfig signingConfigs.xenet } }
 testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
 implementation files('libs/libv2ray.aar')
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'com.google.zxing:core:3.5.3'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}
